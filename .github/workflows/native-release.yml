name: Native Desktop Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ets2-tool/src-tauri

      - name: Build Native Linux Release Binary
        working-directory: ets2-tool/src-tauri
        run: cargo build --release

      - name: Stage Linux release bundle
        run: |
          mkdir -p dist/ets2-tool-linux-x86_64/locales
          cp ets2-tool/src-tauri/target/release/ets2-tool dist/ets2-tool-linux-x86_64/
          cp ets2-tool/src-tauri/locales/*.json dist/ets2-tool-linux-x86_64/locales/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets2-tool-linux-x86_64
          path: dist/ets2-tool-linux-x86_64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ets2-tool/src-tauri

      - name: Build Native Windows Release Binary (.exe)
        working-directory: ets2-tool/src-tauri
        run: cargo build --release

      - name: Stage Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ets2-tool-windows-x86_64\locales, dist\ets2-tool-windows-x86_64\resources\plugins | Out-Null
          Copy-Item ets2-tool\src-tauri\target\release\ets2-tool.exe dist\ets2-tool-windows-x86_64\
          Copy-Item ets2-tool\src-tauri\locales\*.json dist\ets2-tool-windows-x86_64\locales\
          Copy-Item ets2-tool\src-tauri\resources\plugins\simnexus_sdk.dll dist\ets2-tool-windows-x86_64\resources\plugins\

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets2-tool-windows-x86_64
          path: dist/ets2-tool-windows-x86_64

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Archive release bundles
        run: |
          (cd dist/ets2-tool-linux-x86_64 && zip -qr ../ets2-tool-linux-x86_64.zip .)
          (cd dist/ets2-tool-windows-x86_64 && zip -qr ../ets2-tool-windows-x86_64.zip .)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ets2-tool-linux-x86_64.zip
            dist/ets2-tool-windows-x86_64.zip
