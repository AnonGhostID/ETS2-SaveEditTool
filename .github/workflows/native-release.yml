name: Native Desktop Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Native Linux Release Binary
        working-directory: ets2-tool/src-tauri
        run: cargo build --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets2-tool-linux-x86_64
          path: ets2-tool/src-tauri/target/release/ets2-tool

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Native Windows Release Binary (.exe)
        working-directory: ets2-tool/src-tauri
        run: cargo build --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ets2-tool-windows-x86_64
          path: ets2-tool/src-tauri/target/release/ets2-tool.exe
